# Recurring Krakow-area hackathon series (from research/organizers.md).
# For each: when it usually happens -> the site lists it as EXPECTED until real dates are found
# by any source (title must match `match`). To add a series, append a block; nothing else to change.
# months: typical start months. horizon_days: how far ahead to show the placeholder (default 200).

- id: hackyeah
  name: HackYeah
  match: "hackyeah"
  months: [9, 10]
  url: https://hackyeah.pl/
  location: TAURON Arena Kraków
  note: Poland's biggest hackathon (24h, ~3000 people). Registration typically closes in summer - sign up early.
